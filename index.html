<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Time To Go!">
<meta name="theme-color" content="#24427A">
<title>Time To Go!</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=1">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Archivo+Narrow:wght@500;600&family=Cinzel:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css?v=24">
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>

<div class="page">
  <header>
    <div class="band" id="band" aria-hidden="true"></div>
    <div class="top">
      <div class="views" role="group" aria-label="View">
        <button type="button" data-view="trains">Trains</button><button type="button" data-view="tmpl">TMPL</button><button type="button" data-view="grocery">Groceries</button>
      </div>
      <span class="spacer"></span>
      <span class="wx" id="wx"></span>
      <span class="clock" id="clock"></span>
    </div>
  </header>

  <div class="main">
    <div class="col">
      <div class="col" id="notes"></div>
      <section class="plaque" id="plaque" aria-live="polite">
        <canvas id="plaque-bg" aria-hidden="true"></canvas>
        <div class="head quiet" id="head">Listening for trains…</div>
        <div class="what" id="what"></div>
        <div class="sub" id="sub"></div>
      </section>
      <section class="list glass" id="list" aria-label="Trains to Manhattan"></section>
      <section class="list glass" id="places" aria-label="Places" hidden></section>
    </div>
    <div class="col">
      <details class="notices glass" id="notices" hidden><summary id="notices-sum">Service notices</summary><div id="alerts"></div></details>
    </div>
  </div>

  <footer class="foot">
    <button type="button" class="skyline" id="skyline" title="Tap for the moon"></button>
    <span id="status"></span>
    <span class="foot2">
      <button type="button" class="pill" id="sound" aria-pressed="false">Sound</button>
      <button type="button" class="pill" id="awake" aria-pressed="false">Keep screen on</button>
      <button type="button" class="sig" id="sig" aria-label="Pretend mode">SIFRKALON</button>
    </span>
  </footer>
</div>

<div class="pretend" id="pretend" hidden></div>
<div class="pr-badge" id="pr-badge" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="suncalc.js?v=24"></script>
<script src="data.js?v=24"></script>
<script src="places.js?v=24"></script>
<script src="fx.js?v=24"></script>
<script src="mosaic.js?v=24"></script>
<script src="pretend.js?v=24"></script>
<script src="sound.js?v=24"></script>
<script src="app.js?v=24"></script>
</body>
</html>
