<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Out the Door">
<title>Out the Door</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Archivo+Narrow:wght@500;600&family=Cinzel:wght@500;700&family=Pixelify+Sans:wght@400;600&family=VT323&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { -webkit-font-smoothing: antialiased; }
  button { font: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  /* ================= LINE (line map + mosaic) ================= */
  body.t-line {
    background-color: #F1EEE6; color: #1B1C1A; font-family: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
    background-image: linear-gradient(#DDD6C7 1px, transparent 1px), linear-gradient(90deg, #DDD6C7 1px, transparent 1px);
    background-size: 48px 24px, 48px 48px;
  }
  .L { grid-template-columns: minmax(0, 1fr); max-width: 1180px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); display: grid; gap: 18px; }
  .tess { display: flex; height: 10px; overflow: hidden; }
  .tess i { flex: 0 0 10px; height: 10px; margin-right: 2px; }
  .L-top { display: flex; align-items: center; gap: 12px; }
  .L-brand { font-family: "Cinzel", Georgia, serif; font-weight: 700; letter-spacing: 4px; font-size: 15px; flex: 1; white-space: nowrap; }
  @media (max-width: 480px) { .L-brand { letter-spacing: 2px; font-size: 13px; } .L-wx { display: none; } }
  .L-clock { font-weight: 600; font-variant-numeric: tabular-nums; color: #55584F; }
  .toggle { border: 2px solid currentColor; background: transparent; color: inherit; padding: 6px 12px; min-height: 40px; border-radius: 999px; font-size: 14px; font-weight: 600; }
  #L-fx { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0; }
  .L { position: relative; z-index: 1; }
  body.t-line.dark .L-brand, body.t-line.dark .L-clock, body.t-line.dark .L-foot, body.t-line.dark .L-top .toggle, body.t-line.dark .L-wx { color: #F1EEE6; }
  .L-wx { font-family: "Archivo Narrow", sans-serif; font-size: 15px; color: #3E413B; }
  .L-main { display: grid; gap: 16px; }
  @media (min-width: 900px) { .L-main { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; } }
  .L-col { display: grid; gap: 16px; }
  .L-plaque { background: #F8F5EE; border: 8px solid #7A2E2A; outline: 2px solid #C08A2E; outline-offset: -14px; padding: 20px 22px 18px; text-align: center; }
  .L-head1 { font-weight: 800; font-size: clamp(34px, 9vw, 64px); line-height: 1; letter-spacing: -1.5px; white-space: nowrap; color: #1B1C1A; font-variant-numeric: tabular-nums; }
  .L-head1 em { font-style: normal; color: #24427A; }
  .L-head1.now { color: #7A2E2A; }
  .L-what { margin-top: 10px; font-size: 18px; line-height: 1.35; }
  .L-what b { font-weight: 800; }
  .L-sub { color: #55584F; font-family: "Archivo Narrow", sans-serif; font-size: 15px; margin-top: 4px; }
  .L-side { display: grid; gap: 12px; }
  .L-note { background: #F8F5EE; border: 2px solid #C08A2E; padding: 10px 14px; }
  .L-note b { display: block; font-size: 16px; }
  .L-note span { font-family: "Archivo Narrow", sans-serif; font-size: 14px; color: #55584F; }
  .L-notices { background: rgba(248,245,238,0.92); border: 1px solid #B9B09C; }
  .L-notices summary { padding: 10px 14px; font-family: "Cinzel", Georgia, serif; letter-spacing: 2px; font-size: 13px; cursor: pointer; list-style-position: inside; }
  .L-notices > div { display: grid; gap: 10px; padding: 0 12px 12px; }
  .L-chip { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: #24427A; color: #F8F5EE; font-family: "Archivo Narrow", sans-serif; font-size: 11px; letter-spacing: 0.5px; vertical-align: 2px; }
  .L-alert { background: #24427A; color: #F8F5EE; border: 3px solid #F8F5EE; outline: 2px solid #24427A; padding: 10px 14px; font-size: 15px; line-height: 1.35; }
  .L-alert small { display: block; font-family: "Cinzel", serif; letter-spacing: 3px; font-size: 11px; opacity: 0.85; margin-bottom: 3px; }
  .L-map { background: #F8F5EE; border: 2px solid #1B1C1A; padding: 8px 18px; }
  .L-row { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid #E2DCCD; }
  .L-row:last-child { border-bottom: 0; }
  @media (max-width: 600px) {
    .L-row { grid-template-columns: 36px minmax(0, 1fr); grid-template-areas: "b i" "t t"; row-gap: 8px; }
    .L-row .bullet { grid-area: b; } .L-row .L-info { grid-area: i; text-align: left; } .L-row .L-track { grid-area: t; }
  }
  .bullet { width: 34px; height: 34px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 18px; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .L-track { position: relative; height: 34px; min-width: 60px; }
  .L-main > *, .H-main > * { min-width: 0; }
  .L-track .rail { position: absolute; left: 0; right: 14px; top: 14px; height: 6px; border-radius: 3px; }
  .L-track .stn { position: absolute; right: 0; top: 6px; width: 22px; height: 22px; border-radius: 50%; background: #F8F5EE; border: 5px solid #1B1C1A; }
  .L-track .car { position: absolute; top: 8px; width: 28px; height: 18px; border-radius: 5px; background: #1B1C1A; transition: left 1s linear; }
  .L-track .car::after { content: ""; position: absolute; left: 4px; right: 4px; top: 5px; height: 4px; background: #F1D48A; border-radius: 1px; }
  .L-row.go .stn { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(122,46,42,0.25); } }
  .L-info { text-align: right; min-width: 118px; }
  .L-leave { font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
  .L-stn { font-family: "Cinzel", Georgia, serif; font-size: 12px; letter-spacing: 2px; color: #2F6B5E; margin-top: 2px; }
  .L-next { font-family: "Archivo Narrow", sans-serif; font-size: 13px; color: #6B6E68; }
  .L-foot { display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; font-family: "Archivo Narrow", sans-serif; font-size: 14px; color: #55584F; }
  .L-empty { padding: 18px 0; color: #55584F; }

  /* ================= NEIGHBORHOOD (pixel, Gotham-amber nights) ================= */
  body.t-hood { background: #12101F; color: #F4EBD0; font-family: "VT323", "Courier New", monospace; }
  .H { grid-template-columns: minmax(0, 1fr); max-width: 1180px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 14px max(20px, env(safe-area-inset-bottom)); display: grid; gap: 16px; }
  .H-top { display: flex; align-items: center; gap: 12px; font-size: 22px; }
  .H-top .day { flex: 1; color: #C9BCA0; }
  .H-top .toggle { font-family: "Pixelify Sans", sans-serif; border-radius: 0; border-color: #FFC966; color: #FFC966; font-size: 14px; }
  .H-main { display: grid; gap: 16px; }
  @media (min-width: 900px) { .H-main { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); align-items: start; } }
  .H-scene { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; box-shadow: 0 0 0 4px #0A0914, 0 0 0 8px #5E3B26; background: #0B0F1F; }
  .H-box { background: #F4EBD0; color: #1E1A2E; padding: 14px 16px; box-shadow: 0 0 0 4px #1E1A2E, 0 0 0 8px #F4EBD0; margin: 8px; }
  .H-label { font-family: "Pixelify Sans", sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 1px; color: #7A4E2D; }
  .H-quest { font-size: 32px; line-height: 1.02; margin-top: 4px; }
  .H-quest em { font-style: normal; color: #B5402B; }
  .H-col { display: grid; gap: 14px; }
  .H-panel { background: #1E1A33; padding: 12px 14px; box-shadow: 0 0 0 3px #0A0914; }
  .H-panel .H-label { color: #FFC966; margin-bottom: 6px; }
  .H-item { font-size: 22px; line-height: 1.1; padding: 3px 0; }
  .H-item span { color: #B9AFCF; }
  .H-route { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 22px; padding: 4px 0; }
  .H-dot { width: 22px; height: 22px; display: grid; place-items: center; color: #fff; font-family: "Pixelify Sans", sans-serif; font-size: 14px; font-weight: 600; clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); }
  .H-route .when { color: #FFC966; text-align: right; }
  .H-route small { display: block; color: #9C92B5; font-size: 18px; }
  .H-notices summary { cursor: pointer; list-style-position: inside; }
  .H-flyer { background: #F4F1EA; color: #161616; padding: 10px 12px; font-size: 20px; line-height: 1.05; position: relative; box-shadow: 3px 3px 0 #0A0914; }
  .H-flyer:nth-child(odd) { transform: rotate(-1deg); }
  .H-flyer:nth-child(even) { transform: rotate(0.8deg); }
  .H-flyer::before { content: ""; position: absolute; top: -6px; left: 40%; width: 46px; height: 12px; background: rgba(255, 232, 0, 0.75); }
  .H-flyer small { display: block; font-family: "Pixelify Sans", sans-serif; font-size: 12px; color: #D6338F; letter-spacing: 1px; }
  .H-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; font-size: 20px; color: #9C92B5; }
  .H-made { font-family: "Pixelify Sans", sans-serif; background: #FFC966; color: #1E1A2E; border: 0; padding: 8px 14px; min-height: 40px; box-shadow: 0 4px 0 #A9772B; }
  .H-made:active { transform: translateY(3px); box-shadow: 0 1px 0 #A9772B; }

  :focus-visible { outline: 3px solid #FFC966; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .L-track .car { transition: none; } .L-row.go .stn { animation: none; } }
</style>
</head>
<body class="t-line">

<!-- ============ LINE ============ -->
<canvas id="L-fx" aria-hidden="true"></canvas>
<div class="L" id="ui-line">
  <header>
    <div class="tess" id="L-tess" aria-hidden="true"></div>
    <div class="L-top" style="margin-top: 10px">
      <span class="L-brand">OUT THE DOOR</span>
      <span class="L-wx" id="L-wx"></span>
      <span class="L-clock" id="L-clock"></span>
      <button class="toggle" type="button" data-toggle>Neighborhood</button>
    </div>
  </header>
  <div class="L-main">
    <div class="L-col">
      <section class="L-plaque" aria-live="polite">
        <div class="L-head1" id="L-head1">Listening for trains…</div>
        <div class="L-what" id="L-what"></div>
        <div class="L-sub" id="L-sub"></div>
      </section>
      <section class="L-map" id="L-map" aria-label="All train options"></section>
    </div>
    <div class="L-col">
      <div id="L-pack" class="L-col"></div>
      <details class="L-notices" id="L-notices" hidden><summary id="L-notices-sum">Service notices</summary><div id="L-alerts"></div></details>
    </div>
  </div>
  <footer class="L-foot"><span id="L-sky"></span><span id="L-status"></span></footer>
</div>

<!-- ============ NEIGHBORHOOD ============ -->
<div class="H" id="ui-hood" hidden>
  <header class="H-top">
    <span class="day" id="H-day"></span>
    <span id="H-clock"></span>
    <button class="toggle" type="button" data-toggle>Night</button>
  </header>
  <div class="H-main">
    <div class="H-col">
      <canvas class="H-scene" id="H-scene" width="192" height="108" role="img" aria-label="Pixel street: your building, the elevated M, Central Av station"></canvas>
      <section class="H-box" aria-live="polite">
        <div class="H-label">QUEST · INTO THE CITY</div>
        <div class="H-quest" id="H-quest">Listening for trains…</div>
      </section>
    </div>
    <div class="H-col">
      <section class="H-panel"><div class="H-label">OTHER ROUTES</div><div id="H-routes"></div></section>
      <section class="H-panel" id="H-pack" hidden><div class="H-label">PACK</div><div id="H-pack-items"></div></section>
      <details class="H-panel H-notices" id="H-notices" hidden><summary class="H-label" id="H-notices-sum">NOTICES</summary><div class="H-col" id="H-alerts" style="padding-top:10px"></div></details>
      <footer class="H-foot">
        <button class="H-made" type="button" id="H-made">I made it out</button>
        <span id="H-streak"></span>
        <span id="H-sky"></span>
        <span id="H-status"></span>
      </footer>
    </div>
  </div>
</div>

<script src="suncalc.js"></script>
<script src="data.js"></script>
<script src="scene.js"></script>
<script src="fx.js"></script>
<script>
// ---------- themes: line → neighborhood → neighborhood at night ----------
const THEMES = ["line", "hood", "night"];
const NEXT_LABEL = { line: "Neighborhood", hood: "Night", night: "Line map" };
const ROUTE_COLOR = { M: "#FF6319", J: "#996633", Z: "#996633", L: "#A7A9AC" };
let theme = "line";
try { theme = localStorage.getItem("otd-theme") || "line"; } catch (e) {}
const q = new URLSearchParams(location.search).get("theme");
if (THEMES.includes(q)) theme = q;
if (!THEMES.includes(theme)) theme = "line";

function applyTheme() {
  const isLine = theme === "line";
  document.body.className = isLine ? "t-line" : "t-hood";
  document.getElementById("ui-line").hidden = !isLine;
  document.getElementById("ui-hood").hidden = isLine;
  document.querySelectorAll("[data-toggle]").forEach(b => b.textContent = NEXT_LABEL[theme]);
  document.querySelector('meta[name="theme-color"]')?.remove();
  document.getElementById("L-fx").hidden = !isLine;
  if (isLine) { Scene.unmount(); Fx.mount(document.getElementById("L-fx")); }
  else { Fx.unmount(); Scene.mount(document.getElementById("H-scene")); }
  render();
}
document.querySelectorAll("[data-toggle]").forEach(b => b.addEventListener("click", () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  try { localStorage.setItem("otd-theme", theme); } catch (e) {}
  applyTheme();
}));

// mosaic band
const TESS = ["#7A2E2A", "#C08A2E", "#2F6B5E", "#24427A"];
document.getElementById("L-tess").innerHTML = Array.from({ length: 120 }, (_, i) => `<i style="background:${TESS[i % 4]}"></i>`).join("");

// ---------- shared model ----------
const mins = s => Math.max(0, Math.floor(s / 60));
function model() {
  const now = Date.now() / 1000;
  const rows = OPTIONS.map((o, i) => ({
    o, i, color: ROUTE_COLOR[o.route] || "#888",
    catchable: (trains[i] || []).map(x => ({ ...x, leave: x.t - (o.walk + BUFFER_MIN) * 60 - now })).filter(x => x.leave > -30),
  })).filter(r => r.catchable.length).sort((a, b) => a.catchable[0].leave - b.catchable[0].leave);
  const pack = [...warnings, ...airWarnings];
  const age = now - updated;
  const status = lastError ? `Can't reach the MTA. Retrying…` : updated ? (age > 120 ? `Data ${Math.round(age / 60)} min old` : `Live · ${Math.round(age)}s ago`) : "";
  const alertRoutes = new Set(alerts.filter(a => a.active).flatMap(a => a.routes || []));
  return { now, rows, best: rows[0], pack, alerts, alertRoutes, sky: skyLine(now), status };
}

// ---------- LINE render ----------
const TRACK_WINDOW = 15 * 60;   // a car starts its run 15 min before you need to leave
function renderLine(m) {
  document.getElementById("L-clock").textContent = hm(m.now);
  const head = document.getElementById("L-head1"), b = m.best;
  if (!b) {
    head.textContent = updated ? "No trains right now" : "Listening for trains…"; head.className = "L-head1";
    document.getElementById("L-what").textContent = ""; document.getElementById("L-sub").textContent = "";
  } else {
    const x = b.catchable[0], go = x.leave < 60;
    head.className = "L-head1" + (go ? " now" : "");
    head.innerHTML = go ? "Time to go" : `Leave in <em>${mins(x.leave)}</em> min`;
    document.getElementById("L-what").innerHTML = `for the <b>${b.o.route}</b> at ${b.o.station}`;
    document.getElementById("L-sub").textContent = `toward ${x.terminal} · arrives ${hm(x.t)} · ${b.o.walk} min walk`;
  }
  const wx = currentWx;
  document.getElementById("L-wx").textContent = wx ? `${wx.temp}° · ${wx.label}` : "";
  document.body.classList.toggle("dark", Fx.isNight());
  Fx.set({ wx, lat: HOME.lat, lon: HOME.lon });
  document.getElementById("L-pack").innerHTML = m.pack.map(([t, d]) => `<div class="L-note"><b>${t}</b><span>${d}</span></div>`).join("");
  const nEl = document.getElementById("L-notices");
  nEl.hidden = !m.alerts.length;
  document.getElementById("L-notices-sum").textContent = `SERVICE NOTICES · ${m.alerts.length}`;
  document.getElementById("L-alerts").innerHTML = m.alerts.map(a => `<div class="L-alert"><small>${a.when.toUpperCase()}${a.type ? " · " + esc(a.type).toUpperCase() : ""}</small>${a.html}</div>`).join("");

  const map = document.getElementById("L-map");
  if (!m.rows.length) { map.innerHTML = `<div class="L-empty">${updated ? "Nothing catchable right now." : "Loading trains…"}</div>`; }
  else {
    // keep row elements stable so the cars glide instead of jumping
    const keys = m.rows.map(r => "r" + r.i);
    if (map.dataset.keys !== keys.join()) {
      map.innerHTML = m.rows.map(r => `<div class="L-row" id="L-r${r.i}">
        <div class="bullet" style="background:${r.color}">${r.o.route}</div>
        <div class="L-track"><div class="rail" style="background:${r.color}"></div><div class="stn"></div><div class="car"></div></div>
        <div class="L-info"><div class="L-leave"></div><div class="L-stn"></div><div class="L-next"></div></div>
      </div>`).join("");
      map.dataset.keys = keys.join();
    }
    m.rows.forEach(r => {
      const el = document.getElementById("L-r" + r.i), x = r.catchable[0];
      const p = Math.min(1, Math.max(0, 1 - x.leave / TRACK_WINDOW));
      const track = el.querySelector(".L-track");
      el.querySelector(".car").style.left = `${p * Math.max(0, track.clientWidth - 46)}px`;
      el.classList.toggle("go", x.leave < 60);
      el.querySelector(".L-leave").textContent = x.leave < 60 ? "Leave now" : `Leave in ${mins(x.leave)}`;
      const hasNotice = m.alertRoutes.has(r.o.route);
      el.querySelector(".L-stn").innerHTML = esc(r.o.station.toUpperCase()) + (hasNotice ? '<span class="L-chip">notice</span>' : "");
      const later = r.catchable.slice(1, 3).map(y => mins(y.leave)).join(", ");
      el.querySelector(".L-next").textContent = `to ${x.terminal}${later ? ` · then ${later} min` : ""}`;
    });
  }
  document.getElementById("L-sky").textContent = m.sky;
  document.getElementById("L-status").textContent = m.status;
}

// ---------- NEIGHBORHOOD render ----------
function streak() {
  try { return JSON.parse(localStorage.getItem("otd-streak") || "null"); } catch (e) { return null; }
}
const dayKey = d => d.toLocaleDateString("en-CA");
document.getElementById("H-made").addEventListener("click", () => {
  const today = dayKey(new Date()), yest = dayKey(new Date(Date.now() - 864e5));
  const s = streak();
  const next = !s ? { last: today, count: 1 } : s.last === today ? s : { last: today, count: s.last === yest ? s.count + 1 : 1 };
  try { localStorage.setItem("otd-streak", JSON.stringify(next)); } catch (e) {}
  render();
});

function renderHood(m) {
  const d = new Date();
  document.getElementById("H-day").textContent = d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
  document.getElementById("H-clock").textContent = hm(m.now);
  const b = m.best, qEl = document.getElementById("H-quest");
  if (!b) qEl.textContent = updated ? "No trains you can make right now. Rest a while." : "Listening for trains…";
  else {
    const x = b.catchable[0];
    const take = m.pack.length ? ` ${m.pack[0][0].replace(/:.*/, "")}.` : "";
    qEl.innerHTML = x.leave < 60
      ? `Go now! The <b>${b.o.route}</b> reaches ${b.o.station} at ${hm(x.t)}.${take}`
      : `Leave in <em>${mins(x.leave)} min</em> for the <b>${b.o.route}</b> at ${b.o.station}, toward ${x.terminal}.${take}`;
  }
  const pack = document.getElementById("H-pack");
  pack.hidden = !m.pack.length;
  document.getElementById("H-pack-items").innerHTML = m.pack.map(([t, dd]) => `<div class="H-item">${t}<br><span>${dd}</span></div>`).join("");
  document.getElementById("H-routes").innerHTML = m.rows.slice(1).map(r => {
    const x = r.catchable[0], later = r.catchable.slice(1, 3).map(y => mins(y.leave)).join(", ");
    return `<div class="H-route"><div class="H-dot" style="background:${r.color}">${r.o.route}</div>
      <div>${r.o.station}<small>to ${x.terminal}${later ? ` · then ${later}` : ""}</small></div>
      <div class="when">${x.leave < 60 ? "now" : `in ${mins(x.leave)}`}</div></div>`;
  }).join("") || `<div class="H-item"><span>Nothing else coming.</span></div>`;
  document.getElementById("H-notices").hidden = !m.alerts.length;
  document.getElementById("H-notices-sum").textContent = `NOTICES · ${m.alerts.length}`;
  document.getElementById("H-alerts").innerHTML = m.alerts.map(a => `<div class="H-flyer"><small>${a.when.toUpperCase()}${a.type ? " · " + esc(a.type).toUpperCase() : ""}</small>${a.html}</div>`).join("");
  const s = streak();
  document.getElementById("H-streak").textContent = s ? `Streak: ${s.count} day${s.count === 1 ? "" : "s"}` : "";
  document.getElementById("H-sky").textContent = m.sky;
  document.getElementById("H-status").textContent = m.status;

  // scene: the next Manhattan-bound M at Central Av rides the el
  const central = OPTIONS.findIndex(o => o.stop === "M10");
  const next = (trains[central] || []).find(x => x.t > m.now - 60);
  Scene.set({
    forceNight: theme === "night", lat: HOME.lat, lon: HOME.lon,
    rain: currentWx ? ["rain", "storm"].includes(currentWx.kind) : !!warnings.rain,
    snow: currentWx ? currentWx.kind === "snow" : !!warnings.snow,
    umbrella: !!warnings.rain || (currentWx && ["rain", "storm"].includes(currentWx.kind)),
    wx: currentWx,
    leaving: !!b && b.catchable[0].leave < 60,
    train: next ? { secs: next.t - m.now, color: ROUTE_COLOR.M } : null,
  });
}

function render() {
  const m = model();
  if (theme === "line") renderLine(m); else renderHood(m);
}

applyTheme();
refresh();
refreshWeather();
refreshAlerts();
setInterval(refresh, REFRESH_SEC * 1000);
setInterval(refreshWeather, 10 * 60 * 1000);
setInterval(refreshAlerts, 2 * 60 * 1000);
setInterval(render, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { refresh(); refreshWeather(); refreshAlerts(); } });
</script>
</body>
</html>
